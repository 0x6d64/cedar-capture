# Verified 2026-11-21 against the sources recorded in docs/pinned-versions.md.
# Do not bump one value in isolation: AGP, Gradle, KGP and compileSdk constrain each other.
# The build has NOT been run yet (STEP-01): treat the combination as documented, not proven.

[versions]
# KGP that AGP 9.5.2 itself depends on (its POM lists kotlin-gradle-plugin 2.2.10).
# AGP 9 supplies Kotlin for Android modules, so this version must match the Compose Compiler plugin.
kotlin = "2.2.10"
agp = "9.5.2"
composeBom = "2026.09.00" # Compose UI 1.12.1; the newest BOM (2026.11.01, UI 1.13.0) demands compileSdk 37.1, and only platform 37.0 is installed
coreKtx = "1.19.1"
activityCompose = "1.13.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android alias: AGP 9 compiles Kotlin itself (built-in Kotlin) and rejects that plugin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
