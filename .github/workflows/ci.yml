name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        working-directory: tools
        run: pip install -e ".[dev]"
      - name: Lint, types, tests
        working-directory: tools
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest
      - name: Agent files are in sync with agents/
        run: python -m voicetools sync-agents --check

  kotlin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Skipped until the Gradle wrapper is generated and committed (see README).
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: ${{ hashFiles('android/gradlew') != '' }}
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: ${{ hashFiles('android/gradlew') != '' }}
      - name: Core tests
        if: ${{ hashFiles('android/gradlew') != '' }}
        working-directory: android
        run: ./gradlew :core:test
      # Actions are pinned to commit SHAs (the comment names the release). Update a pin by looking up the new
      # release tag and dereferencing it to its commit; do not use a floating tag.
